title = "RimSort gitleaks configuration"

# A config file REPLACES gitleaks' default rule set unless it extends it.
# Without this line every rule would be disabled and the scan would report
# "no leaks found" unconditionally.
[extend]
useDefault = true

# Scanned with `gitleaks dir .` so secret scanning covers the whole tree in
# both the pre-commit hook and `nix flake check`. That mode walks the
# filesystem rather than git, so untracked build artifacts would otherwise be
# scanned and produce false positives (compiled bytecode embeds string
# constants that trip the generic-api-key rule). These are all gitignored and
# never committed.
[allowlist]
description = "Untracked build/runtime artifacts"
paths = [
  '''__pycache__/''',
  '''\.py[co]$''',
  '''\.qm$''',
  '''\.so(\.[\w]+)?$''',
  '''\.dylib$''',
  '''\.dll$''',
  '''\.exe$''',
  '''\.zip$''',
  '''\.tar\.gz$''',
]