name: Nix Flake Check
on:
  # Unlike the reusable workflows pulled in by auto_build.yml, this gate is
  # self-triggering: a broken flake should fail the PR on its own rather than
  # depend on the artifact-build pipeline.
  pull_request: null
  workflow_call: null
  workflow_dispatch: null
  merge_group:
  push:
    branches:
      - main
      - master

permissions: {}

concurrency:
  group: nix-flake-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The flake's filesets include the vendored submodules
          # (steamworkspy, steamfiles) and libs/, so a shallow checkout
          # without submodules cannot build.
          submodules: recursive
          fetch-depth: 0

      # Lockfile policy, not a build check: the nixpkgs input must be
      # NixOS-owned, on a supported ref, and less than 30 days old. The
      # freshness half is kept by flake-update.yml's weekly bump PRs;
      # fail-mode turns the report into a gate.
      - name: Check Nix flake inputs
        uses: DeterminateSystems/flake-checker-action@v14
        with:
          fail-mode: true
          send-statistics: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # Read-only pull: no authToken, so this job can never publish. The
      # cache is populated by nix-cache.yml on merges to main, which is
      # what makes PR rebuilds fast.
      - name: Pull from Cachix
        uses: cachix/cachix-action@v17
        with:
          name: rimsort

      # nix flake check builds and evaluates everything the flake exposes for
      # this system: checks.pytest (the full suite in a pure Nix environment)
      # and the pinned git-hooks.nix hooks (ruff, ruff-format, mypy, pyright,
      # shellcheck, shfmt, markdownlint, deferred-imports,
      # eventbus-subscribers), plus the packaged app itself.
      #
      # This is the same gate developers run locally through `just check`
      # and the installed pre-commit hook, using tool versions pinned by
      # uv.lock via uv2nix rather than whatever a CI action ships.
      - name: Nix flake check
        run: nix flake check --show-trace