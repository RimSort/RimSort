name: Test Packaged Upgrades
on:
  workflow_call: null

permissions: {}

jobs:
  validate-upgrade:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: Darwin_arm64
            directory: RimSort.app
            platform: darwin
          - os: windows-latest
            artifact: Windows_x86_64
            directory: RimSort
            platform: win32
          - os: ubuntu-22.04
            artifact: Ubuntu-22.04_x86_64
            directory: RimSort
            platform: linux
          - os: ubuntu-24.04
            artifact: Ubuntu-24.04_x86_64
            directory: RimSort
            platform: linux24
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Prepare isolated upgrade workspace
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP ("rimsort-upgrade-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $testRoot | Out-Null
          foreach ($name in @('tmp', 'cache', 'app-data', 'downloads', 'extracted', 'runtime')) {
            New-Item -ItemType Directory -Path (Join-Path $testRoot $name) | Out-Null
          }
          "RIMSORT_UPGRADE_ROOT=$testRoot" >> $env:GITHUB_ENV
          foreach ($name in @('TMPDIR', 'TMP', 'TEMP')) { "$name=$testRoot/tmp" >> $env:GITHUB_ENV }
          "UV_CACHE_DIR=$testRoot/cache/uv" >> $env:GITHUB_ENV
          "UV_PYTHON_INSTALL_DIR=$testRoot/cache/python" >> $env:GITHUB_ENV
          "XDG_CACHE_HOME=$testRoot/cache/xdg" >> $env:GITHUB_ENV
          "XDG_CONFIG_HOME=$testRoot/app-data/config" >> $env:GITHUB_ENV
          "XDG_DATA_HOME=$testRoot/app-data/data" >> $env:GITHUB_ENV
          "XDG_RUNTIME_DIR=$testRoot/runtime" >> $env:GITHUB_ENV
          if (-not $IsWindows) { chmod 700 "$testRoot/runtime" }
          "RIMSORT_DEV=1" >> $env:GITHUB_ENV
          "RIMSORT_DEV_DIR=$testRoot/app-data/profile" >> $env:GITHUB_ENV
          "QT_QPA_PLATFORM=offscreen" >> $env:GITHUB_ENV

      - name: Fetch matching source
        run: |
          $repoPath = Join-Path $env:RIMSORT_UPGRADE_ROOT 'repo'
          git clone --no-checkout --depth 1 "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY.git" $repoPath
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git -C $repoPath fetch --depth 1 origin $env:GITHUB_SHA
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git -C $repoPath checkout --detach FETCH_HEAD
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git -C $repoPath submodule update --init --recursive
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Download candidate payload
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.RIMSORT_UPGRADE_ROOT }}/downloads

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ${{ env.RIMSORT_UPGRADE_ROOT }}/repo/pyproject.toml

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Install Linux GUI test tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool libegl-dev libxcb-cursor0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: Validate native upgrade and recovery
        id: validate
        working-directory: ${{ env.RIMSORT_UPGRADE_ROOT }}/repo
        env:
          CANDIDATE_DIRECTORY: ${{ matrix.directory }}
          RIMSORT_UPGRADE_PLATFORM: ${{ matrix.platform }}
        run: |
          $archives = @(Get-ChildItem "$env:RIMSORT_UPGRADE_ROOT/downloads" -Filter '*.tar' -File -Recurse)
          if ($archives.Count -ne 1) { throw 'Ambiguous candidate payload' }
          Remove-Item Env:COPYFILE_DISABLE, Env:DITTONORSRC -ErrorAction SilentlyContinue
          tar -xf $archives[0].FullName -C "$env:RIMSORT_UPGRADE_ROOT/extracted"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:RIMSORT_UPGRADE_CANDIDATE_DIR = "$env:RIMSORT_UPGRADE_ROOT/extracted/$env:CANDIDATE_DIRECTORY"
          $env:UV_PROJECT_ENVIRONMENT = "$PWD/.venv"
          Remove-Item Env:VIRTUAL_ENV, Env:PYTHONPATH, Env:PYTHONHOME -ErrorAction SilentlyContinue
          uv sync --locked --dev
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($IsLinux) {
            xvfb-run -a -s '-screen 0 1280x720x24' uv run --frozen --no-sync pytest --no-qt-log tests/integration/test_packaged_upgrade.py -k native_packaged_upgrade --basetemp="$env:RIMSORT_UPGRADE_ROOT/pytest" -s
          } else {
            uv run --frozen --no-sync pytest --no-qt-log tests/integration/test_packaged_upgrade.py -k native_packaged_upgrade --basetemp="$env:RIMSORT_UPGRADE_ROOT/pytest" -s
          }
          exit $LASTEXITCODE

      - name: Remove disposable upgrade workspace
        if: ${{ always() && steps.validate.outcome == 'success' }}
        run: |
          $testRoot = $env:RIMSORT_UPGRADE_ROOT
          $item = Get-Item -LiteralPath $testRoot
          if ($item.Parent.FullName -ne (Get-Item -LiteralPath $env:RUNNER_TEMP).FullName -or
              $item.Name -notmatch '^rimsort-upgrade-[0-9a-f]{32}$' -or
              ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
            throw 'Refusing to remove an unowned upgrade workspace'
          }
          try { Remove-Item -LiteralPath $testRoot -Recurse -Force -ErrorAction Stop }
          catch { Write-Warning "Workspace cleanup deferred to runner disposal: $_" }
