# Auto tests builds.
# Downloads artifact matching system, nzips them, finds the executable and attempts to run them.

name: Test Builds
on:
  workflow_call: null

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: "arm64"
            platform: "Darwin"
            env:
              ARTIFACT_KEY_GLOB: "*Darwin_arm64*"
              ARTIFACT_KEY: "Darwin_arm64"
              EXPECTED_NAME: "RimSort"
          - os: ubuntu-22.04
            platform: "Ubuntu-22.04"
            arch: "x86_64"
            env:
              ARTIFACT_KEY_GLOB: "Ubuntu-22.04_x86_64"
              ARTIFACT_KEY: "Ubuntu-22.04_x86_64"
              EXPECTED_NAME: "RimSort"
          - os: ubuntu-24.04
            platform: "Ubuntu-24.04"
            arch: "x86_64"
            env:
              ARTIFACT_KEY_GLOB: "Ubuntu-24.04_x86_64"
              ARTIFACT_KEY: "Ubuntu-24.04_x86_64"
              EXPECTED_NAME: "RimSort"
          - os: windows-latest
            platform: "Windows"
            arch: "x86_64"
            env:
              ARTIFACT_KEY_GLOB: "*Windows_x86_64*"
              ARTIFACT_KEY: "Windows_x86_64"
              EXPECTED_NAME: "RimSort.exe"
    steps:
      - name: Download artifact from previous run
        if: ${{ github.event.inputs.run_id != null }}
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: ${{ matrix.env.ARTIFACT_KEY_GLOB }}
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifact from current run
        if: ${{ github.event.inputs.run_id == null }}
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: ${{ matrix.env.ARTIFACT_KEY_GLOB }}

      - name: Un-tar artifact
        run: |
          cd "$(find . -mindepth 1 -type d | head -n 1)"
          tar -xf ./*.tar
        shell: bash

      - name: Download AppImage artifact
        if: matrix.platform == 'Ubuntu-22.04'
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: "${{ matrix.platform }}_${{ matrix.arch }}_appimage"
          path: appimage-test

      - name: Install libfuse2 for AppImage
        if: matrix.platform == 'Ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64
        shell: bash

      - name: Find executable
        id: find
        run: |
          FOUND=$(find . -type f -name ${{ matrix.env.EXPECTED_NAME }})
          echo "FOUND=$FOUND" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Check executable permissions
        continue-on-error: true
        run: |
          if [[ -x ${{ steps.find.outputs.FOUND }} ]]; then
            echo "Executable is executable"
          else
            echo "Executable is not executable. Attempting to continue"
            chmod +x ${{ steps.find.outputs.FOUND }}
            exit 1
          fi
        shell: bash

      - name: If Linux, install likely missing libs for gui
        if: ${{ matrix.platform == 'Ubuntu-22.04' || matrix.platform == 'Ubuntu-24.04' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl-dev
        shell: bash

      - name: If MacOS, install coreutils for timeout
        if: ${{ matrix.platform == 'Darwin' }}
        run: |
          brew install coreutils

      - name: Run executable. Attempt to run the executable, waits 15 seconds, then kills it.
        run: |
          if [[ ${{ matrix.platform }} == "Ubuntu-22.04" || ${{ matrix.platform }} == "Ubuntu-24.04" ]]; then
            export QT_QPA_PLATFORM=offscreen
          fi
          timeout 10 ${{ steps.find.outputs.FOUND }} || EXIT_CODE="$?"

          if [[ $EXIT_CODE == 124 ]]; then
            echo "Executable ran and timedout correctly"
          elif [[ $EXIT_CODE != 0 ]]; then
            echo "Executable failed with exit code $EXIT_CODE"
            exit "$EXIT_CODE"
          else
            echo "Executable ran successfully"
          fi
        shell: bash

      - name: Test AppImage
        if: matrix.platform == 'Ubuntu-22.04'
        run: |
          APPIMAGE=$(find appimage-test/ -name "*.AppImage" | head -n 1)
          if [[ -z "$APPIMAGE" ]]; then
            echo "ERROR: No AppImage found in appimage-test/" >&2
            exit 1
          fi
          chmod +x "$APPIMAGE"
          export QT_QPA_PLATFORM=offscreen
          timeout 10 "$APPIMAGE" || EXIT_CODE="$?"

          if [[ ${EXIT_CODE:-0} == 124 ]]; then
            echo "AppImage ran and timed out correctly"
          elif [[ ${EXIT_CODE:-0} != 0 ]]; then
            echo "AppImage failed with exit code $EXIT_CODE"
            exit "$EXIT_CODE"
          else
            echo "AppImage ran successfully"
          fi
        shell: bash

      - name: Check out AppImage validation source
        if: matrix.platform == 'Ubuntu-22.04'
        uses: actions/checkout@v7
        with:
          path: validation-source
          persist-credentials: false

      - name: Set up Python for AppImage validation
        if: matrix.platform == 'Ubuntu-22.04'
        uses: actions/setup-python@v7
        with:
          python-version-file: validation-source/pyproject.toml

      - name: Set up uv for AppImage validation
        if: matrix.platform == 'Ubuntu-22.04'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Install AppImage GUI test dependencies
        if: matrix.platform == 'Ubuntu-22.04'
        shell: bash
        run: |
          sudo apt-get install -y xvfb xdotool libxcb-cursor0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: Validate native AppImage upgrade and recovery
        if: matrix.platform == 'Ubuntu-22.04'
        working-directory: validation-source
        timeout-minutes: 15
        shell: bash
        run: |
          TEST_ROOT=$(mktemp -d "$RUNNER_TEMP/rimsort-appimage.XXXXXX")
          export TMPDIR="$TEST_ROOT/tmp"
          export XDG_CACHE_HOME="$TEST_ROOT/cache"
          export XDG_CONFIG_HOME="$TEST_ROOT/config"
          export XDG_DATA_HOME="$TEST_ROOT/data"
          export UV_CACHE_DIR="$TEST_ROOT/uv-cache"
          export UV_PROJECT_ENVIRONMENT="$PWD/.venv"
          export RIMSORT_DEV=1
          export RIMSORT_DEV_DIR="$TEST_ROOT/profile"
          export QT_QPA_PLATFORM=xcb
          mkdir -p "$TMPDIR" "$XDG_CACHE_HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME"
          unset VIRTUAL_ENV PYTHONPATH PYTHONHOME
          mapfile -t CANDIDATES < <(find "$GITHUB_WORKSPACE/appimage-test" -type f -name '*.AppImage')
          if [[ ${#CANDIDATES[@]} != 1 ]]; then
            echo "Expected exactly one candidate AppImage" >&2
            exit 1
          fi
          export RIMSORT_APPIMAGE_CANDIDATE="${CANDIDATES[0]}"
          uv sync --locked --dev
          xvfb-run -a -s '-screen 0 1280x720x24' \
            uv run --frozen --no-sync pytest --no-qt-log \
            tests/integration/test_appimage_upgrade.py -k native_appimage_upgrade \
            --basetemp="$TEST_ROOT/pytest" -s
