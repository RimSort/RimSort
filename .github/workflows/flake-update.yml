name: Flake Lock Update
on:
  # Weekly nixpkgs bumps: the flake.lock equivalent of dependabot, which
  # cannot parse flake.lock. Regular bumps are what make the version-pinned
  # permittedInsecurePackages entry in nix/parts/default.nix fail loudly on
  # this workflow's own PRs instead of on a contributor's feature branch.
  schedule:
    - cron: "17 5 * * 1" # Mondays ~05:17 UTC, off the top of the hour
  workflow_dispatch: null

permissions: {}

concurrency:
  group: flake-lock-update
  cancel-in-progress: false

jobs:
  update:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # The action opens the PR with GITHUB_TOKEN, and GitHub does not
      # run workflows for PRs opened by GITHUB_TOKEN. If the bump PR shows
      # no checks, close and reopen it to trigger the Nix Flake Check gate;
      # merge only once it is green.
      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@v29
        with:
          pr-title: "build(deps): update flake.lock"
          pr-labels: |
            dependencies
            automated
